[workspace]
resolver = "2"
members = [
    "core/controller",
    "core/model-client",
    "core/patch",
    "core/trajectory",
    "recipes/rust-repair/crates/verifier",
    "recipes/rust-repair/crates/cli",
    # Copy-me skeleton for a new recipe (compiles + runs a no-op).
    "recipes/_template/crates/verifier",
    "recipes/_template/crates/cli",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/mailtotanvir/nano-agent"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }

# core crates referenced by path
nano-patch = { path = "core/patch" }
nano-trajectory = { path = "core/trajectory" }
nano-model-client = { path = "core/model-client" }
nano-controller = { path = "core/controller" }
rust-repair-verifier = { path = "recipes/rust-repair/crates/verifier" }

[profile.release]
opt-level = 3
lto = "thin"
